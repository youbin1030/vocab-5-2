<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>상명 5학년 영어 단어 인증제 대비 퀴즈 · 선생님 화면</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 24px 32px 48px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .logo-badge {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: linear-gradient(180deg, #A98FEA, #6A4BC8);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(91, 63, 176, 0.28), inset 0 2px 0 rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }
    .header-brand h1 {
      font-size: 32px;
      line-height: 1.15;
    }
    .header-brand p {
      font-size: 19px;
      margin: 4px 0 0;
    }

    /* #setup */
    .setup-card {
      padding: 28px 32px;
    }
    .section-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .section-title {
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .word-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 11px;
      margin-bottom: 24px;
    }
    .word-grid .chip {
      width: 100%;
      justify-content: center;
      padding: 12px 12px;
      border-radius: 20px;
      font-size: 20px;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .word-grid .chip:hover {
      transform: translateY(-2px);
    }
    .setup-options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-top: 20px;
      border-top: 1.5px dashed rgba(94, 84, 128, 0.2);
    }
    .opt-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }
    .opt-label {
      font-size: 22px;
      margin-right: 4px;
    }
    .time-chip {
      font-family: var(--font-ko) !important;
      font-size: 20px;
      padding: 9px 20px;
    }
    .mystery-toggle {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }
    .mystery-toggle input {
      width: 22px;
      height: 22px;
      accent-color: var(--violet-deep);
      cursor: pointer;
    }
    .btn-create {
      font-size: 26px;
      padding: 16px 40px;
    }

    /* #lobby */
    .lobby-layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      align-items: stretch;
    }
    .qr-card {
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between;
    }
    .qr-guide {
      font-size: 22px;
      line-height: 1.35;
      margin: 0 0 18px;
    }
    .qr-box {
      width: 260px;
      height: 260px;
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 26px rgba(46, 37, 80, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .qr-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .room-code-label {
      font-size: 20px;
      margin-bottom: 2px;
    }
    .room-code-value {
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      color: var(--violet-deep);
      letter-spacing: 6px;
    }
    .lobby-right {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .info-bar {
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .today-words {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .today-words .chip {
      font-size: 16px;
      padding: 5px 12px;
    }
    .room-badges {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .room-badges .pill {
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px solid #fff;
      font-size: 18px;
    }
    .players-card {
      padding: 24px 28px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }
    .players-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .players-head h2 {
      font-size: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .count-pill {
      background: linear-gradient(180deg, #A98FEA, #6A4BC8);
      color: #fff;
      font-size: 20px;
      padding: 4px 16px;
    }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 14px;
      align-content: start;
      flex: 1;
    }
    .player-tile {
      background: rgba(255, 255, 255, 0.72);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(46, 37, 80, 0.06);
    }
    .player-name {
      font-size: 20px;
      word-break: keep-all;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty-players {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 16px;
      font-size: 22px;
    }
    .lobby-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1.5px dashed rgba(94, 84, 128, 0.2);
    }
    .btn-delete {
      font-size: 20px;
      padding: 14px 24px;
    }
    .btn-start {
      font-size: 28px;
      padding: 16px 48px;
    }

    /* #game 상단 & 골든 배너 */
    .game-top-bar {
      padding: 14px 24px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .game-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .game-brand .logo-badge {
      width: 50px;
      height: 50px;
      border-radius: 16px;
    }
    .game-brand-title {
      font-size: 24px;
      line-height: 1.15;
    }
    .game-brand-sub {
      font-size: 18px;
      margin-top: 2px;
    }
    .timer-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.68);
      border: 1.5px solid #fff;
      padding: 6px 20px 6px 12px;
      border-radius: 999px;
    }
    .timer-ring {
      width: 52px;
      height: 52px;
      transform: rotate(-90deg);
      flex-shrink: 0;
    }
    .timer-ring-bg {
      fill: none;
      stroke: rgba(94, 84, 128, 0.16);
      stroke-width: 7;
    }
    .timer-ring-fg {
      fill: none;
      stroke: var(--violet-deep);
      stroke-width: 7;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.2s linear, stroke 0.3s ease;
    }
    .timer-ring-fg.urgent {
      stroke: var(--coral);
    }
    .timer-text {
      font-size: 40px;
      font-weight: 700;
      line-height: 1;
      color: var(--ink);
      min-width: 112px;
      text-align: center;
    }
    .timer-text.urgent {
      color: var(--coral);
    }
    .game-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .btn-control {
      font-size: 20px;
      padding: 13px 20px;
    }
    .btn-control.is-blind-on {
      background: linear-gradient(180deg, #D9CCF6, #A98FEA);
      color: var(--ink);
    }
    .golden-banner {
      margin-bottom: 16px;
      padding: 12px 24px;
      border-radius: 22px;
      background: linear-gradient(90deg, #FFE28A, #FFC83D, #FFE28A);
      border: 2px solid #FFF8D6;
      box-shadow: 0 8px 24px rgba(245, 184, 65, 0.35);
      text-align: center;
      font-size: 26px;
      color: #4A3300;
      animation: glow 1.5s infinite ease-in-out;
    }

    /* #game 본문 2열 (왼쪽 레이스 + 오른쪽 330px) */
    .game-body-grid {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 20px;
      align-items: start;
    }
    .race-card {
      position: relative;
      padding: 22px 24px 24px;
      min-height: 290px;
      overflow: hidden;
    }
    .race-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .race-head h2 {
      font-size: 26px;
    }
    .race-content-wrap {
      position: relative;
      transition: filter 0.3s ease;
    }
    .race-content-wrap.is-blurred {
      filter: blur(11px);
      pointer-events: none;
      user-select: none;
    }
    .blind-overlay {
      position: absolute;
      inset: 64px 16px 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 32px rgba(70, 50, 130, 0.16);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 24px;
      z-index: 15;
    }
    .blind-overlay-icon {
      font-size: 46px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .blind-overlay-text {
      font-size: 25px;
      line-height: 1.35;
      color: var(--violet-deep);
    }

    .race-stage {
      position: relative;
      width: 100%;
      transition: height 0.3s ease;
    }
    .race-lane {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 54px;
      display: grid;
      grid-template-columns: 40px 40px 118px 1fr 86px;
      align-items: center;
      gap: 10px;
      padding: 0 8px;
      border-radius: 18px;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.25s ease;
      will-change: transform;
    }
    .lane-rank {
      font-size: 23px;
      font-weight: 700;
      text-align: center;
      color: var(--ink-soft);
    }
    .lane-rank.rank-1 {
      color: #D98A00;
      font-size: 27px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
    }
    .lane-rank.rank-2 {
      color: #6B778D;
      font-size: 25px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
    }
    .lane-rank.rank-3 {
      color: #B45F2B;
      font-size: 25px;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.9);
    }
    .lane-name {
      font-size: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .glass-tube {
      position: relative;
      height: 36px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.52);
      border: 1.5px solid rgba(255, 255, 255, 0.92);
      box-shadow: inset 0 2px 6px rgba(46, 37, 80, 0.1), 0 2px 8px rgba(46, 37, 80, 0.05);
      padding: 3px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }
    .tube-fill {
      height: 100%;
      min-width: 74px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 12px;
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55), 0 2px 8px rgba(46, 37, 80, 0.14);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tube-score {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px rgba(46, 37, 80, 0.45);
      white-space: nowrap;
    }
    .lane-badge-slot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-height: 30px;
    }
    .badge-gift {
      font-size: 14px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, #FFE7A8, #F5B841);
      color: #4A3300;
      border: 1.5px solid #FFF7D6;
      box-shadow: 0 3px 10px rgba(245, 184, 65, 0.45);
      animation: badgeSparkle 0.7s ease-in-out infinite alternate;
      white-space: nowrap;
    }
    @keyframes badgeSparkle {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.08); filter: brightness(1.12); }
    }
    .badge-up {
      font-size: 14px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, #A8F0D6, #2FA37D);
      color: #fff;
      border: 1.5px solid #E2FFF5;
      box-shadow: 0 3px 8px rgba(47, 163, 125, 0.3);
      white-space: nowrap;
    }
    .race-more {
      margin-top: 12px;
      padding: 10px 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.58);
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      text-align: center;
      font-size: 18px;
      color: var(--ink-soft);
    }

    /* 오른쪽 좁은 칸 (330px): 통계 2x2 + 방금 일어난 일 */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .stats-card {
      padding: 18px;
    }
    .stats-title {
      font-size: 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats-grid-2x2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .stat-tile {
      background: rgba(255, 255, 255, 0.68);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-tile-label {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    .stat-tile-val {
      font-size: 24px;
      font-weight: 700;
      color: var(--violet-deep);
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stat-tile-val.hard-word {
      font-size: 20px;
      color: var(--coral);
    }

    .feed-card {
      padding: 18px;
    }
    .feed-title {
      font-size: 20px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .feed-item {
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      font-size: 16px;
      line-height: 1.35;
      color: var(--ink);
    }
    .feed-item.gold {
      background: linear-gradient(90deg, rgba(255, 235, 168, 0.92), rgba(255, 255, 255, 0.85));
      border-color: #FFD24C;
      color: #4A3300;
      font-weight: 600;
    }
    .feed-empty {
      text-align: center;
      padding: 20px 8px;
      font-size: 16px;
      color: var(--ink-soft);
      white-space: pre-line;
    }

    /* #result 시상대 */
    .result-card {
      padding: 32px 36px 36px;
    }
    .result-head {
      text-align: center;
      margin-bottom: 24px;
    }
    .result-head h2 {
      font-size: 40px;
      color: var(--violet-deep);
      margin-bottom: 6px;
    }
    .podium-stage {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      align-items: end;
      max-width: 960px;
      margin: 10px auto 30px;
      padding: 0 12px;
    }
    .podium-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .podium-crown {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 4px;
      filter: drop-shadow(0 4px 8px rgba(245, 184, 65, 0.45));
    }
    .podium-avatar-wrap {
      position: relative;
      margin-bottom: 10px;
      border-radius: 50%;
    }
    .podium-avatar-wrap.gold .avatar {
      border: 5px solid #FFD24C !important;
      box-shadow: 0 0 0 4px rgba(255, 210, 76, 0.35), 0 10px 24px rgba(46, 37, 80, 0.2);
    }
    .podium-avatar-wrap.silver .avatar {
      border: 4px solid #DCE3EE !important;
      box-shadow: 0 0 0 4px rgba(220, 227, 238, 0.4), 0 8px 20px rgba(46, 37, 80, 0.16);
    }
    .podium-avatar-wrap.bronze .avatar {
      border: 4px solid #E5A77B !important;
      box-shadow: 0 0 0 4px rgba(229, 167, 123, 0.35), 0 8px 20px rgba(46, 37, 80, 0.16);
    }
    .podium-name {
      font-size: 25px;
      margin-bottom: 12px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .podium-pedestal {
      width: 100%;
      border-radius: 26px 26px 18px 18px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 30px rgba(70, 50, 130, 0.14), inset 0 2px 0 rgba(255, 255, 255, 0.9);
    }
    .podium-pedestal.rank-1 {
      min-height: 205px;
      background: linear-gradient(180deg, rgba(255, 235, 168, 0.82), rgba(255, 214, 102, 0.56));
      border-color: #FFE07D;
    }
    .podium-pedestal.rank-2 {
      min-height: 162px;
      background: linear-gradient(180deg, rgba(236, 242, 250, 0.82), rgba(206, 217, 232, 0.56));
      border-color: #E6EDF7;
    }
    .podium-pedestal.rank-3 {
      min-height: 136px;
      background: linear-gradient(180deg, rgba(250, 222, 202, 0.82), rgba(235, 184, 148, 0.56));
      border-color: #F5C9AA;
    }
    .pedestal-rank {
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
    }
    .pedestal-rank.r1 { color: #C97A00; }
    .pedestal-rank.r2 { color: #5C687D; }
    .pedestal-rank.r3 { color: #9E4F1E; }
    .pedestal-score {
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
    }
    .pedestal-detail {
      font-size: 16px;
      color: var(--ink-soft);
      background: rgba(255, 255, 255, 0.68);
      padding: 4px 12px;
      border-radius: 999px;
    }

    .runners-up-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      max-width: 960px;
      margin: 0 auto 20px;
    }
    .runner-card {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.65);
    }
    .runner-rank {
      font-size: 28px;
      font-weight: 700;
      color: var(--violet-deep);
      min-width: 48px;
    }
    .runner-info {
      flex: 1;
      min-width: 0;
    }
    .runner-name {
      font-size: 24px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .runner-detail {
      font-size: 16px;
      color: var(--ink-soft);
      margin-top: 2px;
    }
    .runner-score {
      font-size: 26px;
